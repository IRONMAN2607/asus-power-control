name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  headless-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Qt runtime and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libopengl0 desktop-file-utils
          python -m pip install -r requirements.txt
      - name: Test policy, GUI, and installer
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v
